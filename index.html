<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise: Smart Expense Tracker and Budget Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div>
      <h1>💸 SpendWise</h1>
      <p class="tagline">Smart Expense Tracker and Budget Planner</p>
    </div>
    <div class="header-actions">
      <div id="user-info" class="user-info hidden">
        <span id="user-name"></span>
        <button id="logout-btn">Logout</button>
      </div>
      <button id="theme-toggle">Dark mode</button>
    </div>
  </header>

  <section id="auth-section" class="auth-box">
    <div class="panel">
      <h2>Welcome</h2>
      <p class="muted">Login or create an account to continue</p>
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <div class="auth-buttons">
        <button id="login-btn">Login</button>
        <button id="register-btn" class="secondary-btn">Register</button>
      </div>
    </div>
  </section>

  <main id="app-main" class="hidden">
    <section class="summary">
      <div class="card">
        <span class="card-icon">💰</span>
        <div>
          <h3>Total spent</h3>
          <p id="total-amount">0</p>
        </div>
      </div>
      <div class="card">
        <span class="card-icon">📅</span>
        <div>
          <h3>This month</h3>
          <p id="month-amount">0</p>
        </div>
      </div>
      <div class="card">
        <span class="card-icon">🏆</span>
        <div>
          <h3>Top category</h3>
          <p id="top-category">-</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="budget-top">
        <h2>Monthly budget</h2>
        <div class="budget-input">
          <input type="number" id="budget-input" placeholder="Set budget">
          <button id="budget-btn">Save</button>
        </div>
      </div>
      <div class="progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="budget-text" class="muted">No budget set</p>
    </section>

    <section class="panel">
      <h2>Add expense</h2>
      <div class="form-grid">
        <input type="text" id="title" placeholder="Title (e.g. Lunch)">
        <input type="number" id="amount" placeholder="Amount">
        <select id="category">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="date">
        <button id="add-btn">Add</button>
      </div>
    </section>

    <section class="panel">
      <div class="form-grid">
        <input type="text" id="search" placeholder="Search by title...">
        <select id="filter-category">
          <option value="All">All categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
        <input type="month" id="filter-month">
        <select id="sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="high">Amount: high to low</option>
          <option value="low">Amount: low to high</option>
        </select>
        <button id="export-btn">Export CSV</button>
      </div>
    </section>

    <section class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </section>

    <section class="panel chart-section">
      <canvas id="expense-chart"></canvas>
    </section>

    <section class="panel">
      <canvas id="trend-chart"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
